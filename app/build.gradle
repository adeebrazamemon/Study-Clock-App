plugins {
    id 'com.android.application'
}

android {
    namespace 'app.studyclock'
    compileSdk 35

    defaultConfig {
        applicationId "app.studyclock"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Forces every Kotlin module onto one version. Without this, appcompat's
    // kotlin-stdlib 1.8.22 collides with the older kotlin-stdlib-jdk7/jdk8 1.6.21
    // that arrive transitively, and the duplicate classes fail the build.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
