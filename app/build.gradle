plugins {
    id 'com.android.application'
}

android {
    namespace 'app.studyclock'
    compileSdk 36

    defaultConfig {
        applicationId "app.studyclock"
        minSdk 24
        targetSdk 35
        versionCode 20
        versionName "2.9"
    }

    signingConfigs {
        // Committed debug keystore so every build (including CI) signs with the
        // same key -- its SHA-1 is registered in Firebase for Google sign-in.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Forces every Kotlin module onto one version. Without this, appcompat's
    // kotlin-stdlib 1.8.22 collides with the older kotlin-stdlib-jdk7/jdk8 1.6.21
    // that arrive transitively, and the duplicate classes fail the build.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    // Pinned to 1.17.0, not latest: that's the first stable release with
    // NotificationCompat.ProgressStyle and setRequestPromotedOngoing() (used
    // for the API 36 Live Update card), and the last one that only requires
    // compileSdk 36 / AGP 8.9.1+. 1.19.0 itself now requires compileSdk 37
    // and AGP 9.1.0, which is a bigger jump than this app needs.
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Native Google sign-in (WebView can't run Google's OAuth popup): fetch a
    // Google ID token, hand it to the page, which finishes with Firebase JS.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
