name: Deploy web app to GitHub Pages

# Publishes app/src/main/assets/index.html as-is -- the same file the Android
# WebView loads. There is no separate copy to keep in sync: this workflow is
# the only thing that ever puts it on the web.

on:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/index.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp app/src/main/assets/index.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
