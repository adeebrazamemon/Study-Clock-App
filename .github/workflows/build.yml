name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show what was checked out
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- project folder ---"
          ls -la study-clock-android || echo "study-clock-android NOT FOUND"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: study-clock-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-clock-apk
          path: study-clock-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
