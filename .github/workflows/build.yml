name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK to a release

    steps:
      - uses: actions/checkout@v4

      - name: Show what was checked out
        run: ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 started failing (runs 79 and 80), which
      # silently froze the published APK at 4.2 while the web build kept
      # updating. The GitHub runner image already ships an Android SDK, so use
      # that directly instead of depending on a third-party action. Each step is
      # named so a failure identifies itself without needing the logs.
      - name: Locate Android SDK
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "No Android SDK directory at $SDK"; exit 1; }
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          test -n "$SDKMGR" || { echo "sdkmanager not found under $SDK/cmdline-tools"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
          echo "SDK=$SDK"; echo "sdkmanager=$SDKMGR"
          ls "$SDK/platforms" || true

      - name: Install SDK packages for compileSdk 36
        run: |
          set -eu
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-clock-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the same APK to a rolling "latest" release, so the website's
      # Download button can point at a stable public URL that always serves
      # the newest build: .../releases/latest/download/app-debug.apk
      - name: Publish APK to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: app/build/outputs/apk/debug/app-debug.apk
